name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

jobs:
  # ───────────────────────────────────────────────
  # Gate: the exact main-branch CI workflow must pass before any publishing
  # ───────────────────────────────────────────────
  verify:
    name: Full CI
    uses: ./.github/workflows/ci.yml

  release-metadata:
    name: Release Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag and release metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tag must use vMAJOR.MINOR.PATCH, got $GITHUB_REF_NAME"
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          manifest_version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          chart_version=$(awk '/^version:/ { print $2; exit }' deploy/helm/kgateway/Chart.yaml | tr -d '"')
          app_version=$(awk '/^appVersion:/ { print $2; exit }' deploy/helm/kgateway/Chart.yaml | tr -d '"')

          for pair in \
            "Cargo.toml:$manifest_version" \
            "Chart.yaml version:$chart_version" \
            "Chart.yaml appVersion:$app_version"; do
            name="${pair%%:*}"
            actual="${pair#*:}"
            if [[ "$actual" != "$version" ]]; then
              echo "::error::$name is $actual, expected $version from $GITHUB_REF_NAME"
              exit 1
            fi
          done

          jq -e --arg version "$version" '
            .version == $version and (.notes | type == "array" and length > 0
            and all(.[]; type == "string" and length > 0))
          ' release.json >/dev/null

      - name: Verify exact-commit performance evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          candidate_runs="$(
            gh api --method GET \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/benchmarks.yml/runs" \
              -f branch=main \
              -f head_sha="${GITHUB_SHA}" \
              --jq '.workflow_runs[].id'
          )"
          while IFS= read -r run_id; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || continue
            benchmark_job="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest" \
              --jq '.jobs[] | select(.name == "Criterion baseline" and .conclusion == "success") | .id')"
            if [[ "$benchmark_job" =~ ^[0-9]+$ ]]; then
              echo "Verified Performance Baseline job $benchmark_job in run $run_id for $GITHUB_SHA"
              exit 0
            fi
          done <<< "$candidate_runs"
          echo "::error::No successful main Criterion baseline job exists for $GITHUB_SHA"
          exit 1

  # ───────────────────────────────────────────────
  # Build Linux binaries
  # ───────────────────────────────────────────────
  build:
    name: Build / ${{ matrix.target }}
    needs: [verify, release-metadata]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            use_cross: true
          - target: x86_64-unknown-linux-musl
            platform: linux-x86_64-musl
            use_zigbuild: true
          - target: aarch64-unknown-linux-musl
            platform: linux-arm64-musl
            use_zigbuild: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild == true
        run: |
          pip3 install ziglang --quiet
          cargo install cargo-zigbuild --quiet

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --locked -p kgateway --release --target ${{ matrix.target }} --features kube,redis
          elif [ "${{ matrix.use_zigbuild }}" = "true" ]; then
            cargo zigbuild --locked -p kgateway --release --target ${{ matrix.target }} --features kube,redis
          else
            cargo build --locked -p kgateway --release --target ${{ matrix.target }} --features kube,redis
          fi

      - name: Strip (Linux gnu)
        if: matrix.use_zigbuild != true
        run: |
          BIN="target/${{ matrix.target }}/release/kgateway"
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu
            aarch64-linux-gnu-strip "$BIN"
          else
            strip "$BIN"
          fi

      - name: Strip (Linux musl)
        if: matrix.use_zigbuild == true
        run: |
          sudo apt-get install -y --no-install-recommends llvm
          llvm-strip "target/${{ matrix.target }}/release/kgateway"

      - name: Package Linux archive
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/kgateway"
          VER="${GITHUB_REF_NAME#v}"
          ARCHIVE="kgateway-${VER}-${{ matrix.platform }}.tar.gz"
          tar czf "$ARCHIVE" -C "$(dirname "$BIN")" kgateway
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: kgateway-*

  # ───────────────────────────────────────────────
  # Create GitHub Release with binaries
  # ───────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-unknown-linux-*'
          merge-multiple: true
          path: artifacts

      - name: Collect assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir release
          for platform in linux-x86_64 linux-arm64 linux-x86_64-musl linux-arm64-musl; do
            archive="kgateway-${version}-${platform}.tar.gz"
            cp "artifacts/$archive" "artifacts/$archive.sha256" release/
          done
          cd release
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check --strict SHA256SUMS

      - name: Generate release notes
        run: |
          jq -r '.notes[] | "- \(.)"' release.json > /tmp/notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" &>/dev/null; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/notes.md
          fi

  # ───────────────────────────────────────────────
  # Publish to crates.io
  # ───────────────────────────────────────────────
  publish-crate:
    name: Publish to crates.io
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - name: Check crates.io publishing credentials
        id: destination
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Crates.io publishing needs a CARGO_TOKEN secret'
          fi

      - uses: actions/checkout@v4
        if: steps.destination.outputs.enabled == 'true'

      - name: Install Rust
        if: steps.destination.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Publish dry-run
        if: steps.destination.outputs.enabled == 'true'
        run: cargo publish --locked --dry-run

      - name: Publish
        if: steps.destination.outputs.enabled == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: cargo publish --locked

  # ───────────────────────────────────────────────
  # Build and push multi-arch OCI images to GHCR
  # ───────────────────────────────────────────────
  publish-oci:
    name: Publish OCI Images
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download musl binaries
        uses: actions/download-artifact@v4
        with:
          pattern: '*-unknown-linux-musl'
          path: bin

      - name: Extract binaries and prepare build contexts
        shell: bash
        run: |
          mkdir -p bin/linux-amd64 bin/linux-arm64

          tar -xzf bin/x86_64-unknown-linux-musl/*.tar.gz -C bin/linux-amd64
          mv bin/linux-amd64/kgateway bin/linux-amd64/kgateway-amd64

          tar -xzf bin/aarch64-unknown-linux-musl/*.tar.gz -C bin/linux-arm64
          mv bin/linux-arm64/kgateway bin/linux-arm64/kgateway-arm64

          cp Dockerfile bin/linux-amd64/
          cp Dockerfile bin/linux-arm64/

      - name: Set up QEMU for ARM64 runtime image builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          REGISTRY="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/kgateway"
          echo "VER=$VER" >> "$GITHUB_OUTPUT"
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Build and push linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: bin/linux-amd64
          file: bin/linux-amd64/Dockerfile
          platforms: linux/amd64
          build-args: BINARY_NAME=kgateway-amd64
          tags: ${{ steps.version.outputs.REGISTRY }}:${{ steps.version.outputs.VER }}-amd64
          push: true
          provenance: false

      - name: Build and push linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: bin/linux-arm64
          file: bin/linux-arm64/Dockerfile
          platforms: linux/arm64
          build-args: BINARY_NAME=kgateway-arm64
          tags: ${{ steps.version.outputs.REGISTRY }}:${{ steps.version.outputs.VER }}-arm64
          push: true
          provenance: false

      - name: Create and push multi-arch manifest
        run: |
          REGISTRY="${{ steps.version.outputs.REGISTRY }}"
          VER="${{ steps.version.outputs.VER }}"

          # Create manifest for versioned tag
          docker buildx imagetools create -t "${REGISTRY}:${VER}" \
            "${REGISTRY}:${VER}-amd64" \
            "${REGISTRY}:${VER}-arm64"

          # Create manifest for latest tag
          docker buildx imagetools create -t "${REGISTRY}:latest" \
            "${REGISTRY}:${VER}-amd64" \
            "${REGISTRY}:${VER}-arm64"

      - name: Verify multi-arch manifest
        run: |
          REGISTRY="${{ steps.version.outputs.REGISTRY }}"
          VER="${{ steps.version.outputs.VER }}"
          echo "=== ${REGISTRY}:${VER} ==="
          docker buildx imagetools inspect "${REGISTRY}:${VER}"
          echo ""
          echo "=== ${REGISTRY}:latest ==="
          docker buildx imagetools inspect "${REGISTRY}:latest"

      - name: Build and push the control plane image
        uses: docker/build-push-action@v6
        with:
          context: control-plane
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.version.outputs.REGISTRY }}-control:${{ steps.version.outputs.VER }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
